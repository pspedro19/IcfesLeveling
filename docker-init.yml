# ICFES LEVELING - Configuración de Inicialización Docker
# Este archivo define las configuraciones automáticas para el sistema

version: "1.0"

# Configuración de base de datos
database:
  auto_init: true
  init_scripts_order:
    - "01-init.sql"
    - "02-seed-data.sql"
    - "03-boss-tables.sql"
    - "04-monthly-reassessment.sql"
    - "05-premium-system.sql"
    - "06-guild-system.sql"
    - "07-achievement-system.sql"
    - "08-virtual-economy.sql"
    - "11-diagnostic-analytics.sql"
    - "14-multimedia-questions.sql"
    - "15-expanded-achievements.sql"
    - "16-gamification-complete.sql"

