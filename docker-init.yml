  # Usuario administrador por defecto
  default_admin:
    username: "admin"
    email: "admin@icfes.com"
    password: "secret"  # Se hasheará automáticamente
    hashed_password: "$2b$12$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36WQoeG6Lruj3vjPGga31lW"

# Configuración de importación de preguntas
questions_import:
  enabled: true
  excel_file_paths:
    - "/app/allquestions/ICFES_BASE_DATOS_COMPLETA_RUTAS_ACTUALIZADAS.xlsx"
    - "/app/ICFES_questions.xlsx"
    - "/app/ICFES2.xlsx"
    - "/app/ICFES2 (1).xlsx"

  # Mapeo de columnas flexible
  column_mapping:
    question_text:
      - "pregunta"
      - "question"
      - "enunciado"
      - "texto_pregunta"

    options:
      option_a:
        - "opcion_a"
        - "option_a"
        - "a)"
        - "respuesta_a"
      option_b:
        - "opcion_b"
        - "option_b"
        - "b)"
        - "respuesta_b"
      option_c:
        - "opcion_c"
        - "option_c"
        - "c)"
        - "respuesta_c"
      option_d:
        - "opcion_d"
        - "option_d"
        - "d)"
        - "respuesta_d"

    correct_answer:
      - "respuesta"
      - "answer"
      - "correcta"
      - "respuesta_correcta"

    subject:
      - "materia"
      - "subject"
      - "area"
      - "asignatura"

    topic:
      - "tema"
      - "topic"
      - "subtema"
      - "topico"

    explanation:
      - "explicacion"
      - "explanation"
      - "solucion"
      - "justificacion"

  # Alias de materias
  subject_aliases:
    "Matemáticas":
      - "Matematicas"
      - "MATEMÁTICAS"
      - "MATEMATICAS"
      - "Math"

    "Lectura Crítica":
      - "Lenguaje"
      - "LENGUAJE"
      - "Lectura Critica"
      - "LECTURA CRÍTICA"
      - "LECTURA CRITICA"

    "Ciencias Naturales":
      - "Ciencias"
      - "CIENCIAS NATURALES"
      - "CIENCIAS"
      - "Science"

    "Ciencias Sociales":
      - "Sociales"
      - "CIENCIAS SOCIALES"
      - "SOCIALES"
      - "Social Science"

    "Inglés":
      - "English"
      - "INGLÉS"
      - "ENGLISH"
      - "Ingles"

# Configuración de servicios
services:
  backend:
    auto_restart: true
    health_check_url: "http://localhost:4000/health"
    wait_for_db: true

  frontend:
    auto_restart: false
    depends_on:
      - backend

  postgres:
    auto_init_scripts: true
    backup_on_start: false

# Configuración de logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  files:
    - "logs/system.log"
    - "logs/import.log"
    - "logs/errors.log"

# Configuración de verificación del sistema
system_check:
  enabled: true
  verify_after_init:
    - subjects_count: 5
    - topics_count: 16
    - questions_count: 1  # Mínimo 1 pregunta
    - users_count: 1      # Mínimo 1 usuario

  endpoints_to_test:
    - "http://localhost:4000/health"
    - "http://localhost:4000/api/v1/subjects"
    - "http://localhost:4000/api/student/dashboard/stats"

# Configuración de reintentos
retry_config:
  max_attempts: 3
  delay_seconds: 5
  exponential_backoff: true