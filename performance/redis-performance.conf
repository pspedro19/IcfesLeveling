# Redis Performance Optimization Configuration for ICFES Leveling Production

# Basic Configuration
port 6379
bind 0.0.0.0
protected-mode no

# Authentication
requirepass CHANGE_ME_REDIS_PASSWORD

# Persistence Configuration for Performance
# AOF for data safety with optimized settings
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots (optimized for production load)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Client Connection Management
timeout 300
tcp-keepalive 300
tcp-backlog 511
maxclients 10000

# Performance Optimizations
# Disable slow operations logging in production
slowlog-log-slower-than 10000
slowlog-max-len 128

# Enable lazy freeing for better performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Disable unused features for performance
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Lua scripting optimization
lua-time-limit 5000

# Hash table optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog optimization
hll-sparse-max-bytes 3000

# Stream optimization
stream-node-max-bytes 4096
stream-node-max-entries 100

# TLS Configuration (if enabled)
# tls-port 6380
# tls-cert-file /etc/ssl/certs/redis.crt
# tls-key-file /etc/ssl/private/redis.key
# tls-dh-params-file /etc/ssl/certs/redis-dh2048.pem
# tls-ca-cert-file /etc/ssl/certs/ca.crt

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "REDIS_CONFIG_b840fc02d524045429941cc15f59e41cb7be6c52"
rename-command SHUTDOWN REDIS_SHUTDOWN
rename-command DEBUG ""
rename-command EVAL ""

# Log Configuration
loglevel warning
logfile /var/log/redis/redis-server.log
syslog-enabled yes
syslog-ident redis

# Working directory
dir /data