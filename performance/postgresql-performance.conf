# PostgreSQL Performance Tuning for ICFES Leveling Production
# Optimized for a system with 8GB RAM, SSD storage, and high concurrent load

# Connection Settings
max_connections = 200
shared_buffers = 2GB                    # 25% of total RAM
effective_cache_size = 6GB              # 75% of total RAM
work_mem = 16MB                         # Per-operation memory
maintenance_work_mem = 512MB            # For maintenance operations

# Checkpoint Settings (optimized for SSD)
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 64MB

# Background Writer Settings
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# Query Planner Settings
random_page_cost = 1.1                  # Optimized for SSD
effective_io_concurrency = 200          # For SSD
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Memory Settings for Complex Queries
temp_buffers = 32MB
max_prepared_transactions = 100

# Autovacuum Settings (aggressive for high-load production)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 25
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 25
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# Statistics Settings
default_statistics_target = 500         # Higher for better query plans
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
log_statement_stats = off

# Logging Configuration for Performance Monitoring
log_destination = 'stderr,csvlog'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Log slow queries and performance issues
log_min_duration_statement = 1000       # Log queries > 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# Query and Lock Configuration
statement_timeout = 300s                # 5 minutes max per query
idle_in_transaction_session_timeout = 60s
lock_timeout = 30s
deadlock_timeout = 1s

# Parallel Query Settings
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# Replication Settings (if using read replicas)
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# Archive Settings (for backup)
archive_mode = on
archive_command = 'cp %p /opt/icfes/backups/wal/%f'
archive_timeout = 300s

# SSL Configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/postgres.crt'
ssl_key_file = '/etc/ssl/private/postgres.key'
ssl_ca_file = '/etc/ssl/certs/ca.crt'
ssl_ciphers = 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256'
ssl_prefer_server_ciphers = on

# Additional Performance Extensions
shared_preload_libraries = 'pg_stat_statements,pg_hint_plan,auto_explain'

# pg_stat_statements configuration
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on
pg_stat_statements.max = 10000

# auto_explain configuration
auto_explain.log_min_duration = 1000    # Log explain for slow queries
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = off

# Huge Pages (if available)
huge_pages = try

# Network Configuration
listen_addresses = '*'
port = 5432
max_files_per_process = 4000

# Security Settings
password_encryption = scram-sha-256
row_security = on

# Locale and Character Encoding
timezone = 'UTC'
log_timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'

# Error Handling
exit_on_error = off
restart_after_crash = on

# Resource Usage
temp_file_limit = 2GB
max_stack_depth = 2MB

# Background Processes
max_worker_processes = 16
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2

# JIT Compilation (PostgreSQL 11+)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000