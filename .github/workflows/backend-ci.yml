name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'
      - 'database/migrations/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'
      - 'database/migrations/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r apps/backend/requirements.txt && pip install pytest pytest-asyncio httpx

      - name: Run linting
        run: cd apps/backend && python -m py_compile app/main.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          ENVIRONMENT: testing
        run: cd apps/backend && pytest tests/ -v --tb=short

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t icfes-backend:test ./apps/backend
