# Design Tokens para ICFES Leveling - Sistema de Diseño V2.0
# Basado en la estrategia de implementación de estilos mejorada

# ===== COLORS =====
colors:
  # Base Colors
  primary:
    value: "#8B5CF6"
    type: "color"
    description: "Color principal de la aplicación"
  
  secondary:
    value: "#F59E0B"
    type: "color"
    description: "Color secundario para acentos"
  
  accent:
    value: "#10B981"
    type: "color"
    description: "Color de acento para elementos positivos"
  
  # Semantic Colors
  success:
    value: "#22C55E"
    type: "color"
    description: "Color para estados exitosos"
  
  warning:
    value: "#F59E0B"
    type: "color"
    description: "Color para advertencias"
  
  error:
    value: "#EF4444"
    type: "color"
    description: "Color para errores"
  
  info:
    value: "#3B82F6"
    type: "color"
    description: "Color para información"
  
  # Neutral Colors
  neutral:
    50: { value: "#F9FAFB", type: "color" }
    100: { value: "#F3F4F6", type: "color" }
    200: { value: "#E5E7EB", type: "color" }
    300: { value: "#D1D5DB", type: "color" }
    400: { value: "#9CA3AF", type: "color" }
    500: { value: "#6B7280", type: "color" }
    600: { value: "#4B5563", type: "color" }
    700: { value: "#374151", type: "color" }
    800: { value: "#1F2937", type: "color" }
    900: { value: "#111827", type: "color" }
  
  # Background Colors
  background:
    primary: { value: "#FFFFFF", type: "color" }
    secondary: { value: "#F9FAFB", type: "color" }
    tertiary: { value: "#F3F4F6", type: "color" }
    dark: { value: "#111827", type: "color" }
    card: { value: "#FFFFFF", type: "color" }
    overlay: { value: "rgba(0, 0, 0, 0.5)", type: "color" }

# ===== TYPOGRAPHY =====
typography:
  # Font Families
  fontFamily:
    primary: { value: "Inter, system-ui, sans-serif", type: "fontFamily" }
    secondary: { value: "Poppins, system-ui, sans-serif", type: "fontFamily" }
    mono: { value: "Fira Code, monospace", type: "fontFamily" }
    display: { value: "Cinzel, serif", type: "fontFamily" }
  
  # Font Sizes
  fontSize:
    xs: { value: "0.75rem", type: "fontSize" }
    sm: { value: "0.875rem", type: "fontSize" }
    base: { value: "1rem", type: "fontSize" }
    lg: { value: "1.125rem", type: "fontSize" }
    xl: { value: "1.25rem", type: "fontSize" }
    "2xl": { value: "1.5rem", type: "fontSize" }
    "3xl": { value: "1.875rem", type: "fontSize" }
    "4xl": { value: "2.25rem", type: "fontSize" }
    "5xl": { value: "3rem", type: "fontSize" }
    "6xl": { value: "3.75rem", type: "fontSize" }
  
  # Font Weights
  fontWeight:
    light: { value: "300", type: "fontWeight" }
    normal: { value: "400", type: "fontWeight" }
    medium: { value: "500", type: "fontWeight" }
    semibold: { value: "600", type: "fontWeight" }
    bold: { value: "700", type: "fontWeight" }
    extrabold: { value: "800", type: "fontWeight" }
  
  # Line Heights
  lineHeight:
    none: { value: "1", type: "lineHeight" }
    tight: { value: "1.25", type: "lineHeight" }
    snug: { value: "1.375", type: "lineHeight" }
    normal: { value: "1.5", type: "lineHeight" }
    relaxed: { value: "1.625", type: "lineHeight" }
    loose: { value: "2", type: "lineHeight" }

# ===== SPACING =====
spacing:
  # Base spacing scale
  0: { value: "0", type: "spacing" }
  px: { value: "1px", type: "spacing" }
  0.5: { value: "0.125rem", type: "spacing" }
  1: { value: "0.25rem", type: "spacing" }
  1.5: { value: "0.375rem", type: "spacing" }
  2: { value: "0.5rem", type: "spacing" }
  2.5: { value: "0.625rem", type: "spacing" }
  3: { value: "0.75rem", type: "spacing" }
  3.5: { value: "0.875rem", type: "spacing" }
  4: { value: "1rem", type: "spacing" }
  5: { value: "1.25rem", type: "spacing" }
  6: { value: "1.5rem", type: "spacing" }
  7: { value: "1.75rem", type: "spacing" }
  8: { value: "2rem", type: "spacing" }
  9: { value: "2.25rem", type: "spacing" }
  10: { value: "2.5rem", type: "spacing" }
  11: { value: "2.75rem", type: "spacing" }
  12: { value: "3rem", type: "spacing" }
  14: { value: "3.5rem", type: "spacing" }
  16: { value: "4rem", type: "spacing" }
  20: { value: "5rem", type: "spacing" }
  24: { value: "6rem", type: "spacing" }
  28: { value: "7rem", type: "spacing" }
  32: { value: "8rem", type: "spacing" }
  36: { value: "9rem", type: "spacing" }
  40: { value: "10rem", type: "spacing" }
  44: { value: "11rem", type: "spacing" }
  48: { value: "12rem", type: "spacing" }
  52: { value: "13rem", type: "spacing" }
  56: { value: "14rem", type: "spacing" }
  60: { value: "15rem", type: "spacing" }
  64: { value: "16rem", type: "spacing" }
  72: { value: "18rem", type: "spacing" }
  80: { value: "20rem", type: "spacing" }
  96: { value: "24rem", type: "spacing" }

# ===== BORDERS =====
borders:
  # Border Radius
  radius:
    none: { value: "0", type: "borderRadius" }
    sm: { value: "0.125rem", type: "borderRadius" }
    base: { value: "0.25rem", type: "borderRadius" }
    md: { value: "0.375rem", type: "borderRadius" }
    lg: { value: "0.5rem", type: "borderRadius" }
    xl: { value: "0.75rem", type: "borderRadius" }
    "2xl": { value: "1rem", type: "borderRadius" }
    "3xl": { value: "1.5rem", type: "borderRadius" }
    full: { value: "9999px", type: "borderRadius" }
  
  # Border Widths
  width:
    0: { value: "0", type: "borderWidth" }
    px: { value: "1px", type: "borderWidth" }
    2: { value: "2px", type: "borderWidth" }
    4: { value: "4px", type: "borderWidth" }
    8: { value: "8px", type: "borderWidth" }

# ===== SHADOWS =====
shadows:
  # Box Shadows
  sm: { value: "0 1px 2px 0 rgba(0, 0, 0, 0.05)", type: "boxShadow" }
  base: { value: "0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)", type: "boxShadow" }
  md: { value: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)", type: "boxShadow" }
  lg: { value: "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)", type: "boxShadow" }
  xl: { value: "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)", type: "boxShadow" }
  "2xl": { value: "0 25px 50px -12px rgba(0, 0, 0, 0.25)", type: "boxShadow" }
  inner: { value: "inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)", type: "boxShadow" }
  none: { value: "none", type: "boxShadow" }
  
  # Glow Effects
  glow:
    primary: { value: "0 0 20px rgba(139, 92, 246, 0.3)", type: "boxShadow" }
    secondary: { value: "0 0 20px rgba(245, 158, 11, 0.3)", type: "boxShadow" }
    success: { value: "0 0 20px rgba(34, 197, 94, 0.3)", type: "boxShadow" }
    error: { value: "0 0 20px rgba(239, 68, 68, 0.3)", type: "boxShadow" }

# ===== ANIMATIONS =====
animations:
  # Duration
  duration:
    fast: { value: "150ms", type: "time" }
    base: { value: "300ms", type: "time" }
    slow: { value: "500ms", type: "time" }
    slower: { value: "700ms", type: "time" }
    slowest: { value: "1000ms", type: "time" }
  
  # Easing
  easing:
    linear: { value: "linear", type: "cubicBezier" }
    ease: { value: "cubic-bezier(0.4, 0, 0.2, 1)", type: "cubicBezier" }
    easeIn: { value: "cubic-bezier(0.4, 0, 1, 1)", type: "cubicBezier" }
    easeOut: { value: "cubic-bezier(0, 0, 0.2, 1)", type: "cubicBezier" }
    easeInOut: { value: "cubic-bezier(0.4, 0, 0.2, 1)", type: "cubicBezier" }
  
  # Keyframes
  keyframes:
    fadeIn: { value: "fadeIn", type: "keyframe" }
    fadeOut: { value: "fadeOut", type: "keyframe" }
    slideUp: { value: "slideUp", type: "keyframe" }
    slideDown: { value: "slideDown", type: "keyframe" }
    scaleIn: { value: "scaleIn", type: "keyframe" }
    scaleOut: { value: "scaleOut", type: "keyframe" }
    bounce: { value: "bounce", type: "keyframe" }
    pulse: { value: "pulse", type: "keyframe" }
    spin: { value: "spin", type: "keyframe" }

# ===== BREAKPOINTS =====
breakpoints:
  sm: { value: "640px", type: "size" }
  md: { value: "768px", type: "size" }
  lg: { value: "1024px", type: "size" }
  xl: { value: "1280px", type: "size" }
  "2xl": { value: "1536px", type: "size" }

# ===== Z-INDEX =====
zIndex:
  hide: { value: "-1", type: "zIndex" }
  auto: { value: "auto", type: "zIndex" }
  base: { value: "0", type: "zIndex" }
  docked: { value: "10", type: "zIndex" }
  dropdown: { value: "1000", type: "zIndex" }
  sticky: { value: "1100", type: "zIndex" }
  banner: { value: "1200", type: "zIndex" }
  overlay: { value: "1300", type: "zIndex" }
  modal: { value: "1400", type: "zIndex" }
  popover: { value: "1500", type: "zIndex" }
  skipLink: { value: "1600", type: "zIndex" }
  toast: { value: "1700", type: "zIndex" }
  tooltip: { value: "1800", type: "zIndex" }
