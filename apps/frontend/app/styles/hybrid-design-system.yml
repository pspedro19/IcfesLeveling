# Sistema de Diseño Híbrido ICFES Leveling - Best of Breed
# Combina lo mejor de Coursera + Khan Academy + Modern Design

# ===== FILOSOFÍA DE DISEÑO =====
# Coursera: Gamificación premium, progreso visual detallado
# Khan Academy: Claridad educativa, estructura progressiva 
# Moderno: Glassmorphism, micro-interacciones, accesibilidad

# ===== PALETA DE COLORES HÍBRIDA =====
colors:
  # Base Identity (inspirado en Khan Academy)
  brand:
    primary: "#1865f2"      # Khan Academy Blue
    secondary: "#00a60e"    # Khan Academy Green  
    accent: "#8B5CF6"       # Purple (nuestro toque único)
    
  # Coursera-inspired Gradients
  gradients:
    coursera_primary: "linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #1e40af 100%)"
    coursera_success: "linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%)"
    coursera_premium: "linear-gradient(135deg, #7c3aed 0%, #db2777 50%, #be185d 100%)"
    khan_learning: "linear-gradient(135deg, #1865f2 0%, #00a60e 50%, #1565c0 100%)"
    
  # Semantic Colors (enhanced)
  semantic:
    success: "#22C55E"      # Verde más vibrante
    warning: "#F59E0B"      # Naranja equilibrado
    error: "#EF4444"        # Rojo accesible
    info: "#3B82F6"         # Azul informativo
    
  # Gamification Colors (Coursera style)
  gamification:
    xp: "#FCD34D"           # Gold for XP
    rank_s: "#DC2626"       # Red for S-rank
    rank_a: "#F59E0B"       # Orange for A-rank  
    rank_b: "#3B82F6"       # Blue for B-rank
    rank_c: "#6B7280"       # Gray for C-rank
    achievement: "#10B981"   # Green for achievements
    
  # Educational Context (Khan Academy inspired)
  educational:
    beginner: "#22C55E"     # Verde para principiante
    intermediate: "#F59E0B" # Naranja para intermedio
    advanced: "#EF4444"     # Rojo para avanzado
    mastery: "#8B5CF6"      # Púrpura para dominio
    
  # Background System (Modern Glassmorphism)
  backgrounds:
    primary: "rgba(0, 0, 0, 0.9)"
    secondary: "rgba(0, 0, 0, 0.3)"
    card: "rgba(255, 255, 255, 0.05)"
    modal: "rgba(0, 0, 0, 0.8)"
    overlay: "rgba(0, 0, 0, 0.4)"
    glass: "rgba(255, 255, 255, 0.1)"
    glass_strong: "rgba(255, 255, 255, 0.15)"

# ===== TIPOGRAFÍA HÍBRIDA =====
typography:
  # Font Stack (combinando lo mejor)
  families:
    primary: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    display: "Poppins, 'Inter', sans-serif"  # Para títulos
    mono: "'Fira Code', 'SF Mono', 'Monaco', monospace"
    educational: "'Source Sans Pro', 'Inter', sans-serif"  # Khan Academy style
    
  # Escala de Tamaños (optimizada para educación)
  sizes:
    # Micro text
    xs: "0.75rem"      # 12px - Labels, meta info
    sm: "0.875rem"     # 14px - Body small, captions
    
    # Body text
    base: "1rem"       # 16px - Primary body text
    lg: "1.125rem"     # 18px - Large body, tooltips
    
    # Headings (Khan Academy inspired scale)
    xl: "1.25rem"      # 20px - H4, card titles
    "2xl": "1.5rem"    # 24px - H3, section headers
    "3xl": "1.875rem"  # 30px - H2, page titles
    "4xl": "2.25rem"   # 36px - H1, hero titles
    "5xl": "3rem"      # 48px - Display, landing
    "6xl": "3.75rem"   # 60px - Hero display
    
  # Line Heights (optimizada para legibilidad)
  leading:
    none: "1"
    tight: "1.25"      # Para títulos
    snug: "1.375"      # Para subtítulos  
    normal: "1.5"      # Para body text
    relaxed: "1.625"   # Para texto largo
    loose: "2"         # Para espaciado amplio

# ===== ESPACIADO HÍBRIDO =====
spacing:
  # Base scale (8px grid)
  0: "0"
  px: "1px"
  0.5: "0.125rem"    # 2px
  1: "0.25rem"       # 4px  
  1.5: "0.375rem"    # 6px
  2: "0.5rem"        # 8px
  2.5: "0.625rem"    # 10px
  3: "0.75rem"       # 12px
  3.5: "0.875rem"    # 14px
  4: "1rem"          # 16px - Base unit
  5: "1.25rem"       # 20px
  6: "1.5rem"        # 24px
  7: "1.75rem"       # 28px
  8: "2rem"          # 32px
  
  # Extended scale (para layouts grandes)
  10: "2.5rem"       # 40px
  12: "3rem"         # 48px
  16: "4rem"         # 64px
  20: "5rem"         # 80px
  24: "6rem"         # 96px
  32: "8rem"         # 128px
  
  # Educational specific
  card_padding: "1.5rem"      # 24px - Standard card padding
  section_margin: "3rem"      # 48px - Between sections
  content_width: "4rem"       # 64px - Content spacing

# ===== EFECTOS Y SOMBRAS =====
effects:
  # Sombras (Coursera + Khan Academy blend)
  shadows:
    sm: "0 1px 2px 0 rgba(0, 0, 0, 0.05)"
    base: "0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)"
    md: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)"
    lg: "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)"
    xl: "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)"
    "2xl": "0 25px 50px -12px rgba(0, 0, 0, 0.25)"
    inner: "inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)"
    
  # Glow Effects (gamificación)
  glows:
    primary: "0 0 20px rgba(139, 92, 246, 0.4)"
    success: "0 0 20px rgba(34, 197, 94, 0.4)" 
    xp: "0 0 20px rgba(252, 211, 77, 0.4)"
    rank_s: "0 0 30px rgba(220, 38, 38, 0.5)"
    achievement: "0 0 25px rgba(16, 185, 129, 0.4)"
    
  # Glassmorphism
  glass:
    light: "backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.1);"
    medium: "backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.15);"
    strong: "backdrop-filter: blur(24px); background: rgba(255, 255, 255, 0.2);"
    dark: "backdrop-filter: blur(16px); background: rgba(0, 0, 0, 0.3);"

# ===== BORDES Y RADIOS =====
borders:
  # Border Radius (modern but functional)
  radius:
    none: "0"
    sm: "0.125rem"     # 2px
    base: "0.25rem"    # 4px
    md: "0.375rem"     # 6px
    lg: "0.5rem"       # 8px
    xl: "0.75rem"      # 12px
    "2xl": "1rem"      # 16px - Cards
    "3xl": "1.5rem"    # 24px - Large cards
    full: "9999px"     # Pills, avatars
    
  # Border Widths
  widths:
    0: "0"
    px: "1px"
    2: "2px"
    4: "4px"
    8: "8px"

# ===== ANIMACIONES =====
animations:
  # Durations (Khan Academy smooth)
  durations:
    fast: "150ms"      # Hover effects
    base: "250ms"      # Standard transitions
    slow: "400ms"      # Complex animations
    slower: "600ms"    # Page transitions
    
  # Easing (Coursera premium feel)  
  easing:
    linear: "linear"
    ease: "cubic-bezier(0.4, 0, 0.2, 1)"
    ease_in: "cubic-bezier(0.4, 0, 1, 1)"
    ease_out: "cubic-bezier(0, 0, 0.2, 1)"
    ease_in_out: "cubic-bezier(0.4, 0, 0.2, 1)"
    bounce: "cubic-bezier(0.68, -0.55, 0.265, 1.55)"
    
  # Keyframes personalizados
  keyframes:
    float: |
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
    pulse_success: |
      @keyframes pulse_success {
        0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        50% { box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.3); }
      }
    xp_gain: |
      @keyframes xp_gain {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.2) rotate(180deg); }
        100% { transform: scale(1) rotate(360deg); }
      }

# ===== BREAKPOINTS =====
breakpoints:
  sm: "640px"    # Mobile large
  md: "768px"    # Tablet
  lg: "1024px"   # Desktop small
  xl: "1280px"   # Desktop large
  "2xl": "1536px" # Desktop XL

# ===== COMPONENTES HÍBRIDOS =====
components:
  # Button (Khan Academy + Coursera)
  button:
    base: "inline-flex items-center justify-center rounded-lg font-medium transition-all duration-250 focus:outline-none focus:ring-2 focus:ring-offset-2"
    
    sizes:
      sm: "px-3 py-1.5 text-sm"
      md: "px-4 py-2 text-base"
      lg: "px-6 py-3 text-lg"
      xl: "px-8 py-4 text-xl"
      
    variants:
      primary: "bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:from-blue-700 hover:to-purple-700 shadow-lg"
      secondary: "bg-gray-600 text-white hover:bg-gray-700"
      khan: "bg-blue-600 text-white hover:bg-blue-700 shadow-md"
      coursera: "bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-700 hover:to-pink-700 shadow-xl"
      success: "bg-green-600 text-white hover:bg-green-700"
      ghost: "bg-transparent text-gray-700 hover:bg-gray-100"
      
  # Card (Hybrid glassmorphism)
  card:
    base: "backdrop-blur-xl border rounded-2xl transition-all duration-300"
    
    variants:
      default: "bg-black/30 border-purple-500/20 hover:border-purple-400/40"
      glass: "bg-white/10 border-white/20 hover:bg-white/15"
      solid: "bg-white border-gray-200 shadow-lg"
      premium: "bg-gradient-to-br from-purple-500/10 to-pink-500/10 border-purple-400/30"
      
    sizes:
      sm: "p-4"
      md: "p-6" 
      lg: "p-8"
      xl: "p-10"
      
  # Progress (Khan Academy educational)
  progress:
    base: "w-full rounded-full overflow-hidden"
    
    variants:
      default: "bg-gray-200 h-2"
      thick: "bg-gray-200 h-4"
      thin: "bg-gray-200 h-1"
      educational: "bg-black/50 h-3"
      
    bars:
      default: "bg-blue-600 transition-all duration-500 ease-out"
      success: "bg-green-500 transition-all duration-500 ease-out"
      warning: "bg-yellow-500 transition-all duration-500 ease-out"
      gradient: "bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-500 ease-out"
      
  # Badge (Educational context)
  badge:
    base: "inline-flex items-center rounded-full px-3 py-1 text-xs font-medium border"
    
    variants:
      beginner: "bg-green-500/20 text-green-400 border-green-400/30"
      intermediate: "bg-yellow-500/20 text-yellow-400 border-yellow-400/30"
      advanced: "bg-red-500/20 text-red-400 border-red-400/30"
      mastery: "bg-purple-500/20 text-purple-400 border-purple-400/30"
      
# ===== UTILIDADES ESPECÍFICAS =====
utilities:
  # Glassmorphism quick classes
  glass_light: "backdrop-blur-md bg-white/10 border border-white/20"
  glass_dark: "backdrop-blur-lg bg-black/30 border border-white/10"
  glass_strong: "backdrop-blur-xl bg-white/15 border border-white/25"
  
  # Educational helpers
  topic_locked: "opacity-60 pointer-events-none"
  topic_completed: "bg-green-500/10 border-green-400/30"
  topic_current: "ring-2 ring-blue-500 ring-offset-2"
  
  # Gamification
  xp_glow: "shadow-lg shadow-yellow-500/25"
  rank_glow: "shadow-lg shadow-purple-500/25"
  achievement_pulse: "animate-pulse-success"
  
  # Responsive helpers
  mobile_stack: "flex flex-col space-y-4 sm:flex-row sm:space-y-0 sm:space-x-4"
  tablet_grid: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
  desktop_layout: "max-w-7xl mx-auto px-6"
