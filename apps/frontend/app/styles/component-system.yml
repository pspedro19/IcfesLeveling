# Sistema de Componentes para ICFES Leveling - V2.0
# Define las clases base, variantes y estados para todos los componentes

# ===== BUTTON COMPONENT =====
button:
  base: "inline-flex items-center justify-center rounded-md text-sm font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
  
  # Size Variants
  size:
    sm: "px-3 py-1.5 text-xs"
    md: "px-4 py-2 text-sm"
    lg: "px-6 py-3 text-base"
    xl: "px-8 py-4 text-lg"
  
  # Style Variants
  variant:
    primary: "bg-primary text-white hover:bg-primary/90 focus:ring-primary/50 shadow-md hover:shadow-lg"
    secondary: "bg-secondary text-white hover:bg-secondary/90 focus:ring-secondary/50 shadow-md hover:shadow-lg"
    outline: "border-2 border-primary text-primary hover:bg-primary hover:text-white focus:ring-primary/50"
    ghost: "text-primary hover:bg-primary/10 focus:ring-primary/50"
    danger: "bg-error text-white hover:bg-error/90 focus:ring-error/50 shadow-md hover:shadow-lg"
    success: "bg-success text-white hover:bg-success/90 focus:ring-success/50 shadow-md hover:shadow-lg"
  
  # State Variants
  state:
    loading: "opacity-75 cursor-wait"
    disabled: "opacity-50 cursor-not-allowed pointer-events-none"
    active: "ring-2 ring-offset-2 ring-primary/50"
  
  # Glow Variants
  glow:
    primary: "shadow-glow-primary hover:shadow-glow-primary/80"
    secondary: "shadow-glow-secondary hover:shadow-glow-secondary/80"
    success: "shadow-glow-success hover:shadow-glow-success/80"
    error: "shadow-glow-error hover:shadow-glow-error/80"
  
  # Responsive Variants
  responsive:
    mobile: "w-full sm:w-auto"
    tablet: "w-full md:w-auto"
    desktop: "w-auto"

# ===== CARD COMPONENT =====
card:
  base: "bg-background-card rounded-lg border border-neutral-200 shadow-sm hover:shadow-md transition-all duration-200"
  
  # Size Variants
  size:
    sm: "p-4"
    md: "p-6"
    lg: "p-8"
    xl: "p-10"
  
  # Style Variants
  variant:
    default: "bg-background-card border-neutral-200"
    elevated: "bg-background-card border-neutral-200 shadow-lg hover:shadow-xl"
    outlined: "bg-transparent border-2 border-primary/20"
    interactive: "bg-background-card border-neutral-200 hover:border-primary/30 hover:shadow-lg cursor-pointer"
  
  # State Variants
  state:
    hover: "hover:shadow-lg hover:border-primary/30"
    active: "ring-2 ring-primary/20"
    selected: "border-primary bg-primary/5"
  
  # Glow Variants
  glow:
    primary: "shadow-glow-primary"
    secondary: "shadow-glow-secondary"
    success: "shadow-glow-success"
    error: "shadow-glow-error"

# ===== INPUT COMPONENT =====
input:
  base: "block w-full rounded-md border border-neutral-300 px-3 py-2 text-sm placeholder-neutral-500 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all duration-200"
  
  # Size Variants
  size:
    sm: "px-2 py-1.5 text-xs"
    md: "px-3 py-2 text-sm"
    lg: "px-4 py-3 text-base"
    xl: "px-6 py-4 text-lg"
  
  # Style Variants
  variant:
    default: "border-neutral-300 focus:border-primary focus:ring-primary/20"
    error: "border-error focus:border-error focus:ring-error/20"
    success: "border-success focus:border-success focus:ring-success/20"
    warning: "border-warning focus:border-warning focus:ring-warning/20"
  
  # State Variants
  state:
    disabled: "bg-neutral-100 cursor-not-allowed opacity-50"
    readonly: "bg-neutral-50 cursor-default"
    loading: "bg-neutral-50"
  
  # Glow Variants
  glow:
    primary: "focus:shadow-glow-primary"
    error: "focus:shadow-glow-error"
    success: "focus:shadow-glow-success"
    warning: "focus:shadow-glow-warning"

# ===== BADGE COMPONENT =====
badge:
  base: "inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
  
  # Size Variants
  size:
    sm: "px-2 py-0.5 text-xs"
    md: "px-2.5 py-0.5 text-xs"
    lg: "px-3 py-1 text-sm"
  
  # Style Variants
  variant:
    primary: "bg-primary/10 text-primary border border-primary/20"
    secondary: "bg-secondary/10 text-secondary border border-secondary/20"
    success: "bg-success/10 text-success border border-success/20"
    warning: "bg-warning/10 text-warning border border-warning/20"
    error: "bg-error/10 text-error border border-error/20"
    info: "bg-info/10 text-info border border-info/20"
    neutral: "bg-neutral/10 text-neutral-700 border border-neutral-200"
  
  # State Variants
  state:
    solid: "text-white"
    outline: "bg-transparent"
    soft: "bg-opacity-10"
  
  # Glow Variants
  glow:
    primary: "shadow-glow-primary"
    secondary: "shadow-glow-secondary"
    success: "shadow-glow-success"
    error: "shadow-glow-error"

# ===== ALERT COMPONENT =====
alert:
  base: "rounded-lg border p-4"
  
  # Style Variants
  variant:
    info: "bg-info/10 border-info/20 text-info-800"
    success: "bg-success/10 border-success/20 text-success-800"
    warning: "bg-warning/10 border-warning/20 text-warning-800"
    error: "bg-error/10 border-error/20 text-error-800"
  
  # Size Variants
  size:
    sm: "p-3 text-sm"
    md: "p-4 text-base"
    lg: "p-6 text-lg"
  
  # State Variants
  state:
    dismissible: "pr-12"
    withIcon: "pl-12"
    interactive: "cursor-pointer hover:shadow-md transition-shadow duration-200"

# ===== MODAL COMPONENT =====
modal:
  base: "fixed inset-0 z-modal flex items-center justify-center"
  
  # Overlay Variants
  overlay:
    default: "bg-background-overlay backdrop-blur-sm"
    blur: "bg-background-overlay backdrop-blur-md"
    dark: "bg-neutral-900/80"
  
  # Content Variants
  content:
    base: "bg-background-card rounded-lg shadow-2xl max-h-[90vh] overflow-y-auto"
    size:
      sm: "w-full max-w-md mx-4"
      md: "w-full max-w-lg mx-4"
      lg: "w-full max-w-2xl mx-4"
      xl: "w-full max-w-4xl mx-4"
      full: "w-full max-w-7xl mx-4"
  
  # Animation Variants
  animation:
    enter: "animate-scaleIn"
    exit: "animate-scaleOut"
    duration: "duration-200"

# ===== TOOLTIP COMPONENT =====
tooltip:
  base: "absolute z-tooltip px-2 py-1 text-xs font-medium text-white bg-neutral-900 rounded shadow-lg"
  
  # Position Variants
  position:
    top: "bottom-full left-1/2 transform -translate-x-1/2 mb-2"
    bottom: "top-full left-1/2 transform -translate-x-1/2 mt-2"
    left: "right-full top-1/2 transform -translate-y-1/2 mr-2"
    right: "left-full top-1/2 transform -translate-y-1/2 ml-2"
  
  # Style Variants
  variant:
    default: "bg-neutral-900 text-white"
    light: "bg-white text-neutral-900 border border-neutral-200"
    primary: "bg-primary text-white"
    error: "bg-error text-white"
  
  # Animation Variants
  animation:
    enter: "animate-fadeIn"
    exit: "animate-fadeOut"
    duration: "duration-150"

# ===== LOADING COMPONENT =====
loading:
  base: "inline-flex items-center justify-center"
  
  # Spinner Variants
  spinner:
    base: "animate-spin rounded-full border-2 border-neutral-200 border-t-transparent"
    size:
      sm: "w-4 h-4"
      md: "w-6 h-6"
      lg: "w-8 h-8"
      xl: "w-12 h-12"
    color:
      primary: "border-primary border-t-transparent"
      secondary: "border-secondary border-t-transparent"
      white: "border-white border-t-transparent"
  
  # Skeleton Variants
  skeleton:
    base: "animate-pulse bg-neutral-200 rounded"
    text: "h-4 bg-neutral-200 rounded"
    title: "h-6 bg-neutral-200 rounded"
    avatar: "w-10 h-10 bg-neutral-200 rounded-full"
    card: "h-32 bg-neutral-200 rounded-lg"

# ===== NAVIGATION COMPONENT =====
navigation:
  base: "flex items-center space-x-1"
  
  # Item Variants
  item:
    base: "px-3 py-2 text-sm font-medium rounded-md transition-all duration-200"
    default: "text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100"
    active: "bg-primary text-white shadow-md"
    disabled: "text-neutral-400 cursor-not-allowed"
  
  # Tab Variants
  tab:
    base: "border-b-2 border-transparent px-3 py-2 text-sm font-medium transition-all duration-200"
    default: "text-neutral-600 hover:text-neutral-900 hover:border-neutral-300"
    active: "border-primary text-primary"
    disabled: "text-neutral-400 cursor-not-allowed"

# ===== BREADCRUMB COMPONENT =====
breadcrumb:
  base: "flex items-center space-x-2 text-sm"
  
  # Item Variants
  item:
    base: "flex items-center"
    default: "text-neutral-500 hover:text-neutral-700"
    current: "text-neutral-900 font-medium"
    disabled: "text-neutral-400 cursor-not-allowed"
  
  # Separator Variants
  separator:
    default: "text-neutral-400"
    custom: "text-primary"

# ===== PAGINATION COMPONENT =====
pagination:
  base: "flex items-center justify-between"
  
  # Button Variants
  button:
    base: "relative inline-flex items-center px-3 py-2 text-sm font-medium rounded-md transition-all duration-200"
    default: "text-neutral-500 bg-white border border-neutral-300 hover:bg-neutral-50"
    active: "z-10 bg-primary text-white border-primary shadow-md"
    disabled: "text-neutral-400 cursor-not-allowed bg-neutral-100"
  
  # Navigation Variants
  navigation:
    prev: "relative inline-flex items-center px-2 py-2 text-sm font-medium text-neutral-500 bg-white border border-neutral-300 rounded-l-md hover:bg-neutral-50"
    next: "relative inline-flex items-center px-2 py-2 text-sm font-medium text-neutral-500 bg-white border border-neutral-300 rounded-r-md hover:bg-neutral-50"

# ===== FORM COMPONENT =====
form:
  base: "space-y-6"
  
  # Field Variants
  field:
    base: "space-y-2"
    required: "after:content-['*'] after:ml-0.5 after:text-error"
  
  # Label Variants
  label:
    base: "block text-sm font-medium text-neutral-700"
    required: "after:content-['*'] after:ml-0.5 after:text-error"
    disabled: "text-neutral-400"
  
  # Error Variants
  error:
    base: "text-sm text-error"
    withIcon: "flex items-center space-x-1"
  
  # Help Text Variants
  helpText:
    base: "text-sm text-neutral-500"
    error: "text-error"
    success: "text-success"

# ===== DATA DISPLAY COMPONENT =====
dataDisplay:
  # Table Variants
  table:
    base: "min-w-full divide-y divide-neutral-200"
    header: "bg-neutral-50"
    row: "hover:bg-neutral-50 transition-colors duration-150"
    cell: "px-6 py-4 text-sm text-neutral-900"
    headerCell: "px-6 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wider"
  
  # List Variants
  list:
    base: "divide-y divide-neutral-200"
    item: "py-4 first:pt-0 last:pb-0"
    interactive: "hover:bg-neutral-50 cursor-pointer transition-colors duration-150"
  
  # Stat Variants
  stat:
    base: "bg-white overflow-hidden shadow rounded-lg"
    header: "px-4 py-5 sm:p-6"
    value: "text-3xl font-bold text-neutral-900"
    label: "text-sm font-medium text-neutral-500"
    change: "text-sm font-medium"
    positive: "text-success"
    negative: "text-error"
    neutral: "text-neutral-500"

# ===== FEEDBACK COMPONENT =====
feedback:
  # Toast Variants
  toast:
    base: "fixed z-toast flex w-full max-w-sm transform transition-all duration-300"
    position:
      topRight: "top-4 right-4"
      topLeft: "top-4 left-4"
      bottomRight: "bottom-4 right-4"
      bottomLeft: "bottom-4 left-4"
    variant:
      success: "bg-success text-white"
      error: "bg-error text-white"
      warning: "bg-warning text-white"
      info: "bg-info text-white"
  
  # Progress Variants
  progress:
    base: "w-full bg-neutral-200 rounded-full overflow-hidden"
    bar: "h-2 bg-primary transition-all duration-300 ease-out"
    size:
      sm: "h-1"
      md: "h-2"
      lg: "h-3"
      xl: "h-4"
    variant:
      primary: "bg-primary"
      success: "bg-success"
      warning: "bg-warning"
      error: "bg-error"
