ingles:
  metadata:
    total_videos: 25
    topics_covered: 7
    average_duration: 20
    
  topics:
    grammar:
      videos:
        - id: "eng_gram_001"
          youtube_id: "eng_gram_001_yt"
          title: "Tiempos Verbales: Present Perfect vs Past Simple"
          channel: "English Pro ICFES"
          duration_minutes: 25
          difficulty: "INTERMEDIATE"
          quality_score: 0.92
          language: "es"  # Explicación en español
          
          topics_covered:
            - "Estructura de cada tiempo"
            - "Palabras clave (yet, already, since, for)"
            - "Usos específicos"
            - "Errores comunes de hispanohablantes"
          
          practice_exercises:
            - type: "Fill in the blanks"
              count: 20
            - type: "Error correction"
              count: 15
            - type: "Translation"
              count: 10
        
        - id: "eng_gram_002"
          youtube_id: "eng_gram_002_yt"
          title: "Conditional Sentences: Zero to Third Conditional"
          channel: "Grammar Master"
          duration_minutes: 30
          difficulty: "ADVANCED"
          quality_score: 0.89
          
          conditionals:
            - type: "Zero"
              structure: "If + present, present"
              use: "General truths"
              example: "If you heat water, it boils"
            - type: "First"
              structure: "If + present, will + verb"
              use: "Real possibilities"
              example: "If it rains, I will stay home"
            - type: "Second"
              structure: "If + past, would + verb"
              use: "Hypothetical present"
              example: "If I were rich, I would travel"
            - type: "Third"
              structure: "If + past perfect, would have + pp"
              use: "Hypothetical past"
              example: "If I had studied, I would have passed"
    
    reading_comprehension:
      videos:
        - id: "eng_read_001"
          youtube_id: "eng_read_001_yt"
          title: "ICFES Reading Strategies: Skimming and Scanning"
