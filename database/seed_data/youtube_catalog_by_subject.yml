# ============================================
# METADATOS Y CONFIGURACIÓN
# ============================================

recommendation_config:
  minimum_quality_score: 0.80
  maximum_videos_per_session: 5
  preferred_duration_range: [15, 45]
  
  scoring_weights:
    semantic_similarity: 0.50
    difficulty_match: 0.20
    engagement_metrics: 0.15
    recency: 0.10
    completion_rate: 0.05
  
  filtering_rules:
    - "Exclude videos with quality_score < 0.80"
    - "Exclude videos longer than 60 minutes for beginners"
    - "Prioritize Spanish language for explanation videos"
    - "Include at least 1 practice-focused video per topic"

update_schedule:
  catalog_review: "monthly"
  quality_reassessment: "quarterly"
  new_video_addition: "weekly"
  deprecated_video_removal: "monthly"

analytics_tracking:
  metrics_collected:
    - "video_start_count"
    - "video_completion_rate"
    - "average_watch_time"
    - "replay_count"
    - "speed_changes"
    - "pause_frequency"
    - "correlation_with_improvement"
  
  reporting_frequency: "weekly"
  dashboard_update: "real-time"

# ============================================
# NOTAS Y COMENTARIOS
# ============================================

notes:
  curation_process: |
    Todos los videos han sido revisados manualmente por expertos en educación
    y validados contra los estándares ICFES 2024-2025.
  
  quality_criteria:
    - "Precisión del contenido"
    - "Claridad de explicación"
    - "Calidad de audio/video"
    - "Alineación con ICFES"
    - "Engagement estudiantil"
  
  licensing: |
    Los videos son contenido público de YouTube. El sistema ICFES Leveling
    no reclama propiedad sobre el contenido, solo proporciona curación y
    recomendaciones educativas.
  
  continuous_improvement: |
    El catálogo se actualiza basándose en:
    - Feedback estudiantil
    - Métricas de mejora académica
    - Nuevos videos populares
    - Cambios en el formato ICFES

