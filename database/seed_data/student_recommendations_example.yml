# ============================================
# SISTEMA DE CHAT IA CONTEXTUAL
# ============================================

ai_assistant:
  enabled: true
  model: "gpt-4"
  
  available_interactions:
    - type: "question_explanation"
      description: "Pregunta sobre cualquier pregunta fallada"
      example: "¿Por qué la respuesta correcta es C en la pregunta de álgebra?"
    
    - type: "concept_clarification"
      description: "Aclaración de conceptos"
      example: "¿Qué es exactamente una función lineal?"
    
    - type: "video_discussion"
      description: "Preguntas sobre los videos"
      example: "No entendí la parte del minuto 5:30 sobre factorización"
    
    - type: "strategy_help"
      description: "Estrategias para resolver"
      example: "¿Cómo identifico rápidamente una diferencia de cuadrados?"
    
    - type: "practice_generation"
      description: "Generar más práctica"
      example: "Dame 5 ejercicios similares a los que fallé"
  
  context_awareness:
    - "Recuerda todas tus preguntas falladas"
    - "Conoce tu nivel de habilidad actual"
    - "Adapta explicaciones a tu estilo de aprendizaje"
    - "Sugiere recursos adicionales relevantes"
    - "Monitorea tu progreso en tiempo real"
  
  sample_responses:
    - prompt: "¿Por qué fallé la pregunta de sistemas de ecuaciones?"
      response: |
        Fallaste porque cometiste un error algebraico al despejar 'y' en la segunda ecuación.
        
        Tu proceso fue:
        x - y = 1 → y = x - 1 ✓ (correcto)
        
        Pero al sustituir en la primera ecuación:
        2x + 3(x - 1) = 7
        2x + 3x - 3 = 7
        5x = 10 ✓ (correcto)
        x = 2 ✓ (correcto)
        
        El error vino al calcular y:
        Pusiste y = 1, pero debería ser:
        y = x - 1 = 2 - 1 = 1 ❌
        
        Espera, revisando... el cálculo da y = 1, pero la respuesta correcta dice y = 1.5.
        
        Verifiquemos con la ecuación original:
        2(2) + 3y = 7
        4 + 3y = 7
        3y = 3
        y = 1
        
        Hmm, parece haber un error en la respuesta marcada como correcta. 
        ¿Podrías verificar el enunciado original?

