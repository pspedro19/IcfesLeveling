# AlertManager Configuration for ICFES Leveling Production
global:
  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@yourdomain.com'
  smtp_auth_username: 'alerts@yourdomain.com'
  smtp_auth_password: 'CHANGE_ME_EMAIL_PASSWORD'
  smtp_auth_identity: 'alerts@yourdomain.com'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # Critical alerts go to immediate notification channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 15m
      
    # Security alerts
    - match_re:
        alertname: 'BruteForceAttack|SSLCertificateExpiry'
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 5m
      
    # Business alerts
    - match_re:
        alertname: 'LowUserActivity|TestCompletionRateDrop|PaymentProcessingIssues'
      receiver: 'business-team'
      group_wait: 5m
      repeat_interval: 4h
      
    # Database alerts
    - match_re:
        alertname: 'DatabaseConnectionHigh|SlowQueries'
      receiver: 'database-team'
      group_wait: 2m
      repeat_interval: 30m

# Inhibition rules
inhibit_rules:
  # Inhibit warning alerts if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    
  # Inhibit service-specific alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'HighErrorRate|HighResponseTime'
    equal: ['job']

# Notification receivers
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: 'devops@yourdomain.com'
        subject: 'ICFES Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # Critical alerts with multiple notification channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@yourdomain.com'
        subject: '🚨 CRITICAL ALERT: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Job: {{ .Labels.job }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          Runbook: https://docs.yourdomain.com/alerts/{{ .Labels.alertname }}
          Grafana: https://grafana.yourdomain.com/d/overview
          {{ end }}
        headers:
          Priority: 'high'
          
    # Slack integration for critical alerts
    slack_configs:
      - api_url: 'CHANGE_ME_SLACK_WEBHOOK_URL'
        channel: '#critical-alerts'
        title: '🚨 Critical Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        send_resolved: true
        
    # PagerDuty integration for critical alerts
    pagerduty_configs:
      - routing_key: 'CHANGE_ME_PAGERDUTY_INTEGRATION_KEY'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          instance: '{{ range .Alerts }}{{ .Labels.instance }}{{ end }}'

  # Security team notifications
  - name: 'security-team'
    email_configs:
      - to: 'security@yourdomain.com'
        subject: '🔒 Security Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          🔒 SECURITY ALERT 🔒
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          Please investigate immediately.
          {{ end }}
        headers:
          Priority: 'high'
          
    slack_configs:
      - api_url: 'CHANGE_ME_SECURITY_SLACK_WEBHOOK_URL'
        channel: '#security-alerts'
        title: '🔒 Security Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt.Format "15:04:05" }}
          {{ end }}

  # Business team notifications
  - name: 'business-team'
    email_configs:
      - to: 'business@yourdomain.com'
        subject: '📊 Business Metric Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          📊 BUSINESS METRIC ALERT
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          This may impact business metrics. Please review.
          {{ end }}

  # Database team notifications
  - name: 'database-team'
    email_configs:
      - to: 'dba@yourdomain.com'
        subject: '🗄️ Database Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          🗄️ DATABASE ALERT
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          Database performance may be affected.
          {{ end }}

# Time intervals for notification rate limiting
time_intervals:
  - name: 'business-hours'
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '17:00'
        weekdays: ['monday:friday']
        location: 'America/New_York'
        
  - name: 'weekends'
    time_intervals:
      - weekdays: ['saturday', 'sunday']