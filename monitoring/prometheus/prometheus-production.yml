# Prometheus configuration for ICFES Leveling Platform - Production
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'icfes-production'
    replica: 'prometheus-01'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v1

# Load alerting rules
rule_files:
  - "rules/*.yml"
  - "rules/icfes-alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # ICFES Backend Application
  - job_name: 'icfes-backend'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # ICFES Frontend Application
  - job_name: 'icfes-frontend'
    static_configs:
      - targets: ['frontend:3000']
    scrape_interval: 15s
    metrics_path: /api/metrics
    scrape_timeout: 10s

  # WebSocket Service
  - job_name: 'icfes-websocket'
    static_configs:
      - targets: ['websocket:8003']
    scrape_interval: 15s
    metrics_path: /metrics

  # AI Service
  - job_name: 'icfes-ai-service'
    static_configs:
      - targets: ['ai-service:8002']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 15s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics

  # ClickHouse Analytics (if available)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http
    params:
      query: ['SELECT * FROM system.metrics FORMAT Prometheus']

  # Nginx Load Balancer
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s
    metrics_path: /metrics

  # Node/System Metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics

  # Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics

  # Custom Business Metrics
  - job_name: 'icfes-business-metrics'
    static_configs:
      - targets: ['backend:8001']
    scrape_interval: 30s
    metrics_path: /business-metrics
    scrape_timeout: 15s
    honor_labels: true

  # Health Check Monitoring
  - job_name: 'health-checks'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://backend:4000/health
        - http://frontend:3000/api/health
        - http://websocket:8003/health
        - http://ai-service:8002/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SSL Certificate Monitoring
  - job_name: 'ssl-certificates'
    static_configs:
      - targets:
        - https://icfes-leveling.com:443
        - https://api.icfes-leveling.com:443
    metrics_path: /probe
    params:
      module: [ssl_cert_check]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ssl-exporter:9219

  # Database Connection Pool Monitoring
  - job_name: 'database-pools'
    static_configs:
      - targets: ['backend:8002']
    scrape_interval: 30s
    metrics_path: /db-pool-metrics

# Remote write configuration (for external storage if needed)
