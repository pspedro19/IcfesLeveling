version: '3.8'

services:
  # Production Nginx Load Balancer with Enhanced Security
  nginx:
    image: nginx:1.25-alpine
    container_name: icfes_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ./public/mathimg:/var/www/mathimg:ro
    depends_on:
      - frontend
      - backend
    networks:
      - icfes_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'

  # PostgreSQL Production Database with Enhanced Configuration
  postgres:
    image: postgres:16-alpine
    container_name: icfes_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameplay_db}
      POSTGRES_USER: ${POSTGRES_USER:-gameplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/production:/docker-entrypoint-initdb.d/production:ro
      - ./logs/postgres:/var/log/postgresql
      - ./config/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/var/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameplay} -d ${POSTGRES_DB:-gameplay_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    user: postgres
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_DB:-2G}
          cpus: ${CPU_LIMIT_DB:-2.0}
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis Production Cache with Enhanced Security
  redis:
    image: redis:7.2-alpine
    container_name: icfes_redis_prod
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes 
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --tcp-keepalive 60
      --timeout 300
      --protected-mode yes
      --bind 0.0.0.0
      --port 6379
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
      - ./logs/redis:/var/log/redis
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    user: redis
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_REDIS:-256M}
          cpus: ${CPU_LIMIT_REDIS:-0.5}
        reservations:
          memory: 128M
          cpus: '0.2'

  # ClickHouse Production Analytics with Enhanced Configuration
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    container_name: icfes_clickhouse_prod
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-gameplay_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data_prod:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server
      - ./database/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./config/clickhouse:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_CLICKHOUSE:-1G}
          cpus: ${CPU_LIMIT_CLICKHOUSE:-1.0}
        reservations:
          memory: 512M
          cpus: '0.5'

  # Backend Production Service with Enhanced Features
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.production
      target: production
      args:
        - ENVIRONMENT=production
        - INSTALL_DEV=false
    image: icfes-backend:${VERSION:-latest}
    container_name: icfes_backend_prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - WORKERS=${WORKERS:-4}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-1000}
      - TIMEOUT=${TIMEOUT:-30}
      - KEEPALIVE=${KEEPALIVE:-2}
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-true}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-8000}
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:8000:8000"  # Prometheus metrics
    volumes:
      - ./logs/backend:/app/logs
      - ./mathimg:/app/mathimg:ro
      - ./uploads:/app/uploads:rw
      - ./backups:/app/backups:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_BACKEND:-1G}
          cpus: ${CPU_LIMIT_BACKEND:-1.0}
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Frontend Production Service with Enhanced Performance
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.production
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
        - NEXT_PUBLIC_ENVIRONMENT=production
        - NEXT_PUBLIC_ENABLE_ANALYTICS=${NEXT_PUBLIC_ENABLE_ANALYTICS:-true}
        - NEXT_PUBLIC_ENABLE_PWA=${NEXT_PUBLIC_ENABLE_PWA:-true}
    image: icfes-frontend:${VERSION:-latest}
    container_name: icfes_frontend_prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_ENVIRONMENT=production
      - NEXT_PUBLIC_ENABLE_ANALYTICS=${NEXT_PUBLIC_ENABLE_ANALYTICS:-true}
      - NEXT_PUBLIC_ENABLE_PWA=${NEXT_PUBLIC_ENABLE_PWA:-true}
    ports:
      - "127.0.0.1:4001:3000"
    volumes:
      - ./logs/frontend:/app/logs
      - ./public/mathimg:/app/public/mathimg:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      - backend
    user: nextjs
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_FRONTEND:-512M}
          cpus: ${CPU_LIMIT_FRONTEND:-0.5}
        reservations:
          memory: 256M
          cpus: '0.2'

  # WebSocket Production Service with Enhanced Scalability
  websocket:
    build:
      context: ./apps/websocket
      dockerfile: Dockerfile.production
      target: production
    image: icfes-websocket:${VERSION:-latest}
    container_name: icfes_websocket_prod
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEBSOCKET_SECRET=${WEBSOCKET_SECRET}
      - MAX_CONNECTIONS=${WS_MAX_CONNECTIONS:-1000}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./logs/websocket:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      redis:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.2'

  # AI Service Production with Enhanced Capabilities
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile.production
      target: production
    image: icfes-ai-service:${VERSION:-latest}
    container_name: icfes_ai_service_prod
    environment:
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-2000}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - ENABLE_CACHING=${ENABLE_AI_CACHING:-true}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./logs/ai-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      redis:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: icfes_prometheus_prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
      - ./logs/prometheus:/var/log/prometheus
    networks:
      - icfes_network
    restart: unless-stopped
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.1.0
    container_name: icfes_grafana_prod
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.icfes-leveling.com
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logs/grafana:/var/log/grafana
    networks:
      - icfes_network
    restart: unless-stopped
    depends_on:
      - prometheus
    user: "472"
    security_opt:
      - no-new-privileges:true

  # Log Aggregation with Fluent Bit
  fluent-bit:
    image: fluent/fluent-bit:2.1.9
    container_name: icfes_fluent_bit_prod
    volumes:
      - ./logs:/var/log/host:ro
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    networks:
      - icfes_network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

# Production Networks with Enhanced Security
networks:
  icfes_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET:-172.20.0.0/16}
          gateway: ${GATEWAY:-172.20.0.1}
    driver_opts:
      com.docker.network.bridge.name: icfes-br0
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"

# Production Volumes with Enhanced Configuration
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis
  clickhouse_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/clickhouse
  prometheus_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/prometheus
  grafana_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/grafana

# Health Check Configuration
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

# Logging Configuration
x-logging-defaults: &logging-defaults
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"