# DISCLAIMER Y NOTAS IMPORTANTES
important_notes:
  plan_flexibility: |
    Este plan está diseñado como una guía personalizada basada en tu desempeño actual.
    Es importante adaptarlo a tu ritmo de aprendizaje y disponibilidad de tiempo.
    
  progress_monitoring: |
    El progreso será monitoreado automáticamente. Las recomendaciones se actualizarán
    semanalmente basándose en tu desempeño real vs. las predicciones.
    
  content_updates: |
    El catálogo de videos se actualiza constantemente. Nuevas recomendaciones pueden
    aparecer si se encuentran contenidos más relevantes para tus necesidades.
    
  disclaimer: |
    Las predicciones están basadas en modelos estadísticos y pueden variar según
    factores individuales. El éxito depende del compromiso personal con el plan de estudio.

