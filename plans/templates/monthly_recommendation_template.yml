# RECOMENDACIONES DE CONTENIDO (Videos priorizados por debilidad)
content_recommendations:
  # Videos recomendados con score > 0.75 organizados por debilidad
  critical_interventions:
    # Para debilidades críticas (severity = critical)
    ${CRITICAL_WEAKNESS_1}:
      videos:
        - video_id: ${CRITICAL_VIDEO_1_ID}
          title: "${CRITICAL_VIDEO_1_TITLE}"
          channel: "${CRITICAL_VIDEO_1_CHANNEL}"
          duration_minutes: ${CRITICAL_VIDEO_1_DURATION}
          youtube_url: "${CRITICAL_VIDEO_1_URL}"
          recommendation_score: ${CRITICAL_VIDEO_1_SCORE}
          recommendation_type: "${CRITICAL_VIDEO_1_TYPE}"
          confidence_level: "${CRITICAL_VIDEO_1_CONFIDENCE}"
          targets_error: "${CRITICAL_VIDEO_1_ERROR}"
          
        - video_id: ${CRITICAL_VIDEO_2_ID}
          title: "${CRITICAL_VIDEO_2_TITLE}"
          channel: "${CRITICAL_VIDEO_2_CHANNEL}"
          duration_minutes: ${CRITICAL_VIDEO_2_DURATION}
          youtube_url: "${CRITICAL_VIDEO_2_URL}"
          recommendation_score: ${CRITICAL_VIDEO_2_SCORE}
          recommendation_type: "${CRITICAL_VIDEO_2_TYPE}"
          confidence_level: "${CRITICAL_VIDEO_2_CONFIDENCE}"
          targets_error: "${CRITICAL_VIDEO_2_ERROR}"
          
  concept_reinforcement:
    # Para debilidades significativas que necesitan refuerzo conceptual
    ${CONCEPT_WEAKNESS_1}:
      videos:
        - video_id: ${CONCEPT_VIDEO_1_ID}
          title: "${CONCEPT_VIDEO_1_TITLE}"
          channel: "${CONCEPT_VIDEO_1_CHANNEL}"
          duration_minutes: ${CONCEPT_VIDEO_1_DURATION}
          youtube_url: "${CONCEPT_VIDEO_1_URL}"
          recommendation_score: ${CONCEPT_VIDEO_1_SCORE}
          recommendation_type: "${CONCEPT_VIDEO_1_TYPE}"
          confidence_level: "${CONCEPT_VIDEO_1_CONFIDENCE}"
          semantic_similarity: ${CONCEPT_VIDEO_1_SEMANTIC}
          
  skill_building:
    # Videos para desarrollo de habilidades específicas
    ${SKILL_WEAKNESS_1}:
      videos:
        - video_id: ${SKILL_VIDEO_1_ID}
          title: "${SKILL_VIDEO_1_TITLE}"
          channel: "${SKILL_VIDEO_1_CHANNEL}"
          duration_minutes: ${SKILL_VIDEO_1_DURATION}
          youtube_url: "${SKILL_VIDEO_1_URL}"
          recommendation_score: ${SKILL_VIDEO_1_SCORE}
          recommendation_type: "${SKILL_VIDEO_1_TYPE}"
          difficulty_alignment: ${SKILL_VIDEO_1_DIFFICULTY}
          
  maintenance_review:
    # Videos para mantener fortalezas existentes
    strengths_maintenance:
      - video_id: ${MAINTENANCE_VIDEO_1_ID}
        title: "${MAINTENANCE_VIDEO_1_TITLE}"
        subject_area: "${MAINTENANCE_VIDEO_1_SUBJECT}"
        recommended_frequency: "weekly"
        
# PLAN DE ESTUDIO ESTRUCTURADO (Calendario 1-3-7-14-30 días)
study_plan:
  # Plan inmediato (1 día)
  day_1:
    focus: "Debilidad más crítica"
    target_weakness: "${CRITICAL_WEAKNESS_1}"
    recommended_activities:
      - type: "video_review"
        content: "${CRITICAL_VIDEO_1_TITLE}"
        estimated_time_minutes: ${CRITICAL_VIDEO_1_DURATION}
        priority: "high"
        
      - type: "practice_questions"
        topic: "${CRITICAL_WEAKNESS_1}"
        question_count: 5
        estimated_time_minutes: 15
        focus: "error_remediation"
        
      - type: "concept_review"
        subject: "${CRITICAL_WEAKNESS_1_SUBJECT}"
        estimated_time_minutes: 10
        
    total_estimated_time: ${DAY_1_TOTAL_TIME}
    success_criteria:
      - "Completar video recomendado"
      - "Responder correctamente 3/5 preguntas de práctica"
      - "Identificar patrón de error común"
  
  # Plan corto plazo (3 días)
  days_1_to_3:
    focus: "Top 2 debilidades críticas"
    target_weaknesses: ["${CRITICAL_WEAKNESS_1}", "${CRITICAL_WEAKNESS_2}"]
    daily_time_commitment: ${DAYS_3_DAILY_TIME}
    
    activities_progression:
      day_1: ["critical_video_1", "practice_set_1", "error_analysis"]
      day_2: ["critical_video_2", "practice_set_2", "concept_mapping"]
      day_3: ["review_session", "mixed_practice", "progress_assessment"]
      
    success_criteria:
      - "Mejora de 10% en accuracy para debilidades objetivo"
      - "Reducción de tiempo promedio en 20%"
      - "Eliminación de error sistemático dominante"
  
  # Plan semanal (7 días)
  week_1:
    focus: "Debilidades críticas + 1 fortaleza"
    balanced_approach: true
    target_weaknesses: ["${CRITICAL_WEAKNESS_1}", "${CRITICAL_WEAKNESS_2}", "${WEAKNESS_3}"]
    strength_maintenance: "${STRENGTH_1}"
    
    weekly_schedule:
      monday:
        - type: "critical_intervention"
          weakness: "${CRITICAL_WEAKNESS_1}"
          time_minutes: 45
          
      tuesday:
        - type: "concept_building"
          weakness: "${CRITICAL_WEAKNESS_2}"
          time_minutes: 30
          
      wednesday:
        - type: "mixed_practice"
          topics: ["${CRITICAL_WEAKNESS_1}", "${STRENGTH_1}"]
          time_minutes: 35
          
      thursday:
        - type: "skill_development"
          weakness: "${WEAKNESS_3}"
          time_minutes: 40
          
      friday:
        - type: "comprehensive_review"
          all_topics: true
          time_minutes: 50
          
      saturday:
        - type: "diagnostic_practice"
          mixed_topics: true
          time_minutes: 60
          
      sunday:
        - type: "rest_and_review"
          light_maintenance: true
          time_minutes: 20
    
    weekly_targets:
      accuracy_improvement: "+15%"
      speed_improvement: "+25%"
      consistency_score: ">80%"
  
  # Plan bi-semanal (14 días)
  weeks_1_to_2:
    focus: "Consolidación y expansión"
    progression_strategy: "gradual_difficulty_increase"
    
    week_1_goals:
      - "Estabilizar debilidades críticas"
      - "Introducir conceptos intermedios"
      - "Establecer rutina de estudio"
      
    week_2_goals:
      - "Expandir a debilidades secundarias"
      - "Integrar conocimientos"
      - "Preparar para evaluación"
      
    milestones:
      day_7: "Evaluación de progreso intermedia"
      day_14: "Evaluación comprehensiva"
      
  # Plan mensual (30 días)
  month_plan:
    overall_goal: "Transformación de debilidades en competencias"
    strategic_approach: "spiral_learning"
    
    phase_1_days_1_7:
      focus: "Estabilización crítica"
      primary_weaknesses: 2
      target_improvement: "40%"
      
    phase_2_days_8_14:
      focus: "Expansión controlada"
      additional_topics: 2
      integration_level: "basic"
      
    phase_3_days_15_21:
      focus: "Consolidación avanzada"
      mixed_practice_increase: "60%"
      complex_problems: true
      
    phase_4_days_22_30:
      focus: "Evaluación y ajuste"
      comprehensive_assessment: true
      next_month_preparation: true
      
    monthly_targets:
      overall_theta_improvement: "+0.3"
      critical_weaknesses_resolved: ">=3"
      new_strengths_developed: ">=1"
      study_consistency: ">90%"

# PREDICCIÓN DE MEJORA (Estimación basada en ML)
predicted_improvement:
  # Basado en modelos de ML entrenados con datos históricos
  model_version: "v2.1_irt_enhanced"
  confidence_interval: 0.85
  
  # Predicciones por timeline
  predictions:
    day_1:
      theta_change: +0.05
      accuracy_improvement: "+5%"
      confidence: 0.92
      
    day_3:
      theta_change: +0.12
      accuracy_improvement: "+12%"
      confidence: 0.88
      
    week_1:
      theta_change: +0.25
      accuracy_improvement: "+20%"
      confidence: 0.85
      
    week_2:
      theta_change: +0.35
      accuracy_improvement: "+28%"
      confidence: 0.82
      
    month_1:
      theta_change: +0.45
      accuracy_improvement: "+35%"
      confidence: 0.78
      
  # Predicciones por debilidad específica
  weakness_specific_predictions:
    ${CRITICAL_WEAKNESS_1}:
      current_theta: ${WEAKNESS_1_THETA}
      predicted_theta_month: ${WEAKNESS_1_PRED_THETA}
      resolution_probability: ${WEAKNESS_1_RESOLUTION_PROB}
      estimated_sessions_to_proficiency: ${WEAKNESS_1_SESSIONS_TO_PROF}
      
  # Factores que influyen en la predicción
  prediction_factors:
    student_engagement_history: ${ENGAGEMENT_SCORE}
    learning_velocity: ${LEARNING_VELOCITY}
    topic_difficulty_factor: ${TOPIC_DIFFICULTY}
    available_study_time: ${AVAILABLE_TIME}
    
  # Escenarios optimista/pesimista
  scenarios:
    optimistic:
      condition: "Seguimiento completo del plan"
      theta_improvement: +0.6
      timeline_acceleration: "20%"
      
    realistic:
      condition: "Seguimiento del 80% del plan"
      theta_improvement: +0.45
      timeline_standard: "100%"
      
    pessimistic:
      condition: "Seguimiento del 60% del plan"
      theta_improvement: +0.25
      timeline_deceleration: "40%"

# CONFIGURACIÓN DE SEGUIMIENTO Y MÉTRICAS
tracking_and_metrics:
  # Métricas clave a monitorear
  key_performance_indicators:
    - name: "accuracy_improvement"
      current_baseline: ${CURRENT_ACCURACY}
      target_month_end: ${TARGET_ACCURACY}
      measurement_frequency: "daily"
      
    - name: "response_time_efficiency"
      current_baseline: ${CURRENT_AVG_TIME}
      target_improvement: "-25%"
      measurement_frequency: "weekly"
      
    - name: "theta_progression"
      current_baseline: ${THETA_GLOBAL}
      target_month_end: ${TARGET_THETA}
      measurement_frequency: "weekly"
      
    - name: "study_consistency"
      target: ">85%"
      measurement: "days_active / total_days"
      
  # Alertas automáticas
  automated_alerts:
    - condition: "accuracy_decline > 10%"
      action: "immediate_review_session"
      notification: true
      
    - condition: "study_gap > 3_days"
      action: "motivational_reminder"
      content_suggestion: "quick_review_video"
      
    - condition: "theta_stagnation > 1_week"
      action: "plan_adjustment"
      escalation: "educational_specialist"

# METADATOS DE GENERACIÓN
generation_metadata:
  # Información técnica del proceso de generación
  algorithm_details:
    embedding_model: "text-embedding-3-large"
    similarity_threshold: 0.75
    diversification_applied: true
    weakness_detection_model: "irt_enhanced_v2"
    
  data_sources:
    user_answers: ${TOTAL_ANSWERS}
    video_catalog_size: ${CATALOG_SIZE}
    embeddings_generated: ${EMBEDDINGS_COUNT}
    analysis_period_days: 90
    
  computation_stats:
