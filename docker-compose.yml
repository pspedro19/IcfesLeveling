services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: icfes_postgres
    environment:
      POSTGRES_DB: gameplay_db
      POSTGRES_USER: gameplay
      POSTGRES_PASSWORD: gameplay123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/allquestions:/data  # Mount Excel files directory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameplay -d gameplay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: icfes_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - icfes_network

  # ClickHouse Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: icfes_clickhouse
    environment:
      CLICKHOUSE_DB: gameplay_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: icfes_backend
    ports:
      - "4000:4000"  # ✅ ALINEADO: Puerto externo e interno igual
    environment:
      - DATABASE_URL=postgresql://gameplay:gameplay123@postgres:5432/gameplay_db
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=clickhouse://default:clickhouse123@clickhouse:9000/gameplay_analytics
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=development
      - DEBUG=true
      - ALLOWED_ORIGINS=http://localhost:4001,http://127.0.0.1:4001,http://localhost:4000,http://127.0.0.1:4000,http://localhost:4002,http://127.0.0.1:4002
      - AUTO_IMPORT_QUESTIONS=true
      - QUESTIONS_EXCEL_PATH=/seed_data/questions.xlsx
      - IMPORT_CLEAR_EXISTING=true
      - ICFES_CATALOG_CSV_PATH=/seed_data/topics_catalog.csv
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gameplay_db
      - DB_USER=gameplay
      - DB_PASSWORD=gameplay123
    volumes:
      - ./apps/backend:/app
      - ./logs:/app/logs
      - ./database/seed_data:/app/seed_data
      - ./database/seed_data/load_all_data.py:/app/seed_data/load_all_data.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]  # ✅ ALINEADO: Puerto 4000
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload  # ✅ ALINEADO: Puerto 4000

  # WebSocket Service
  websocket:
    build:
      context: ./apps/websocket
      dockerfile: Dockerfile
    container_name: icfes_websocket
    ports:
      - "4002:4002"  # ✅ ALINEADO: Puerto externo e interno igual
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://gameplay:gameplay123@postgres:5432/gameplay_db
      - ENVIRONMENT=development
      - DEBUG=true
      - PORT=4002  # ✅ ALINEADO: Variable de entorno para puerto
    volumes:
      - ./apps/websocket:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]  # ✅ ALINEADO: Puerto 4002
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    command: python main.py  # ✅ ALINEADO: main.py ya usa puerto 4002

  # AI Service
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: icfes_ai_service
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://gameplay:gameplay123@postgres:5432/gameplay_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./apps/ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    command: python main.py

  # Frontend (Next.js) - DESARROLLO SIMPLE Y EFECTIVO
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.simple
    container_name: icfes_frontend
    ports:
      - "4001:4001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4002
      - NODE_ENV=development
      - PORT=4001
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=2048
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_SHARP_PATH=/app/node_modules/sharp
    volumes:
      - ./apps/frontend:/app
      - frontend_cache:/app/.next/cache
      - /app/node_modules
    depends_on:
      - backend
      - websocket
      - ai-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - icfes_network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1.5G
          cpus: '0.75'
    mem_limit: 3g
    mem_reservation: 1.5g
    shm_size: 512mb

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  frontend_cache:
    driver: local

networks:
  icfes_network:
    driver: bridge 