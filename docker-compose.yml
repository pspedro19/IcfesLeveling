services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: icfes_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gameplay_db}
      POSTGRES_USER: ${DB_USER:-gameplay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/allquestions:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gameplay} -d ${DB_NAME:-gameplay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network

  # pgAdmin (development only)
  pgadmin:
    image: dpage/pgadmin4
    container_name: icfes_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@icfes.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - icfes_network
    profiles:
      - dev

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: icfes_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - icfes_network

  # ClickHouse Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: icfes_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-gameplay_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: icfes_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-gameplay}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-gameplay_db}
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}@clickhouse:9000/${CLICKHOUSE_DATABASE:-gameplay_analytics}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4001,http://127.0.0.1:4001,http://localhost:4000,http://127.0.0.1:4000,http://localhost:4002,http://127.0.0.1:4002}
      - AUTO_IMPORT_QUESTIONS=${AUTO_IMPORT_QUESTIONS:-true}
      - QUESTIONS_EXCEL_PATH=/seed_data/questions.xlsx
      - IMPORT_CLEAR_EXISTING=${IMPORT_CLEAR_EXISTING:-false}
      - ICFES_CATALOG_CSV_PATH=/seed_data/catalogs/icfes_topics.csv
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-gameplay_db}
      - DB_USER=${DB_USER:-gameplay}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY:-}
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY:-}
      - WOMPI_EVENT_SECRET=${WOMPI_EVENT_SECRET:-}
    volumes:
      - ./apps/backend:/app
      - ./logs:/app/logs
      - ./database/seed_data:/app/seed_data
      - ./database/seed_data/load_all_data.py:/app/seed_data/load_all_data.py:ro
      - ./database/allquestions:/app/database/allquestions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network

  # WebSocket Service
  websocket:
    build:
      context: ./apps/websocket
      dockerfile: Dockerfile
    container_name: icfes_websocket
    ports:
      - "4002:4002"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${DB_USER:-gameplay}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-gameplay_db}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PORT=4002
    volumes:
      - ./apps/websocket:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 4002)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    command: python main.py

  # AI Service
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: icfes_ai_service
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${DB_USER:-gameplay}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-gameplay_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./apps/ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    command: python main.py

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  icfes_network:
    driver: bridge
