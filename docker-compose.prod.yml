version: '3.8'

services:
  # Production Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: icfes_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - icfes_network
    restart: unless-stopped

  # PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: icfes_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-gameplay_db}
      POSTGRES_USER: ${DB_USER:-gameplay}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/production:/docker-entrypoint-initdb.d/production:ro
      - ./logs/postgres:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gameplay} -d ${DB_NAME:-gameplay_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    user: postgres
    security_opt:
      - no-new-privileges:true

  # Redis Production Cache
  redis:
    image: redis:7-alpine
    container_name: icfes_redis_prod
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --tcp-keepalive 60
      --timeout 300
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis_data_prod:/data
      - ./logs/redis:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - icfes_network
    user: redis
    security_opt:
      - no-new-privileges:true

  # ClickHouse Production Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: icfes_clickhouse_prod
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-gameplay_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"  # Bind to localhost only
      - "127.0.0.1:9000:9000"  # Bind to localhost only
    volumes:
      - clickhouse_data_prod:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true

  # Backend Production Service
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
      target: production
    container_name: icfes_backend_prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - LOG_LEVEL=info
    volumes:
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Frontend Production Service
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
        - NEXT_PUBLIC_ENVIRONMENT=production
    container_name: icfes_frontend_prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_ENVIRONMENT=production
    volumes:
      - ./logs/frontend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      - backend
    user: nextjs
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # WebSocket Production Service
  websocket:
    build:
      context: ./apps/websocket
      dockerfile: Dockerfile.prod
      target: production
    container_name: icfes_websocket_prod
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=info
    volumes:
      - ./logs/websocket:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      redis:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # AI Service Production
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile.prod
      target: production
    container_name: icfes_ai_service_prod
    environment:
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=info
    volumes:
      - ./logs/ai-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - icfes_network
    depends_on:
      redis:
        condition: service_healthy
    user: appuser
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

# Production Networks
networks:
  icfes_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Production Volumes
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/icfes/postgres
  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/icfes/redis
  clickhouse_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/icfes/clickhouse